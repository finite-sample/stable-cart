[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "stable-cart"
description = "Bootstrap audits of prediction instability for fitted models and model-building pipelines."
authors = [
    { name = "Gaurav Sood", email = "contact@gsood.com" },
    { name = "Arav Bhosle", email = "aravbhosle@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "machine learning",
    "stability",
    "sklearn",
    "prediction stability",
    "bootstrap",
    "model validation",
    "reproducibility"
]
dependencies = [
    "numpy>=1.23.0",
    "scikit-learn>=1.6.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
version = "3.0.0"

[project.urls]
Homepage = "https://github.com/finite-sample/stable-cart"
Repository = "https://github.com/finite-sample/stable-cart"
Documentation = "https://finite-sample.github.io/stable-cart/"
Changelog = "https://github.com/finite-sample/stable-cart/blob/main/CHANGELOG.md"
Issues = "https://github.com/finite-sample/stable-cart/issues"

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5",
]
dev = [
    { include-group = "test" },
    "codespell>=2.4",
    "ruff>=0.7.0",
    "pre-commit>=3.0",
    "pyright>=1.1.300",
    "vulture>=2.14",
    "deadcode>=2.4.1",
    "pydoclint>=0.5",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
# N803/N806: the sklearn API names feature matrices X, X_train, X_val — uppercase
# is the convention every estimator in the ecosystem follows.
# RUF022: __all__ is grouped by workflow rather than sorted.
ignore = ["D203", "D213", "B008", "C901", "E501", "N803", "N806", "RUF022"]

# The package is documented in NumPy style throughout; the fleet default is google.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
"examples/**" = ["T201"]
"stable_cart/**" = ["S101"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --strict-markers"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "e2e: end-to-end integration tests",
    "slow: slow running tests",
]

[tool.coverage.run]
branch = true
source = ["stable_cart"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.codespell]
# docs/_build is a local Sphinx artifact (gitignored); .venv and uv.lock are vendored.
skip = "./docs/_build,./.venv,./uv.lock,./dist,./htmlcov,./.git,./.research-archive"
builtin = "clear,rare,en-GB_to_en-US"
# MAPE is the standard acronym for mean absolute prediction error (Riley &
# Collins 2023), not a misspelling of "map".
ignore-words-list = "mape,noone"

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|\.research-archive|tests|docs|examples'

[tool.pyright]
include = ["stable_cart"]
typeCheckingMode = "standard"

[tool.uv.build-backend]
module-root = ""

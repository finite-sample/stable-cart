[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "stable-cart"
description = "Unified stable CART decision trees with 7 stability primitives and cross-method learning for enhanced prediction stability."
authors = [
    { name = "Gaurav Sood", email = "contact@gsood.com" },
    { name = "Arav Bhosle", email = "aravbhosle@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "machine learning",
    "decision trees",
    "CART",
    "stability",
    "variance reduction",
    "sklearn",
    "prediction stability",
    "bootstrap",
    "honest learning"
]
dependencies = [
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/finite-sample/stable-cart"
Repository = "https://github.com/finite-sample/stable-cart"
Documentation = "https://finite-sample.github.io/stable-cart/"
Changelog = "https://github.com/finite-sample/stable-cart/blob/main/CHANGELOG.md"
Issues = "https://github.com/finite-sample/stable-cart/issues"

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pandas>=1.5.0",
    "ruff>=0.7.0",
    "pre-commit>=3.0",
    "matplotlib>=3.3.0",
    "pyright>=1.1.300",
    "vulture>=2.14",
    "deadcode>=2.4.1",
    "pydoclint>=0.5",
]
benchmark = [
    "seaborn>=0.11.0",
    "jupyterlab>=3.0.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "nbsphinx>=0.9.0",
    "pandoc>=2.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "pandas>=1.5.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
# Notebooks are rendered documentation, not library source.
extend-exclude = ["docs"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
# N803/N806: the sklearn API names feature matrices X, X_train, X_val — uppercase
# is the convention every estimator in the ecosystem follows.
# RUF022: __all__ is grouped by role (trees, evaluation, research APIs), not sorted.
ignore = ["D203", "D213", "B008", "C901", "E501", "N803", "N806", "RUF022"]

# The package is documented in NumPy style throughout; the fleet default is google.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
# S101: the library uses assert for internal invariants. Note that four of these
# validate user-supplied fractions and so vanish under `python -O` (see AUDIT.md).
"stable_cart/**" = ["S101"]
# Benchmark and experiment drivers report progress on stdout by design, and skip
# a dataset rather than abort the sweep when one model fails on it.
"scripts/**" = ["T201", "D", "S110", "RUF001"]
"experiments/**" = ["T201", "D", "S110"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --strict-markers"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "e2e: end-to-end integration tests",
    "slow: slow running tests",
    "benchmark: benchmark tests",
]

[tool.coverage.run]
branch = true
source = ["stable_cart"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/benchmark/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.codespell]
# docs/_build is a local Sphinx artifact (gitignored); .venv and uv.lock are vendored.
skip = "./docs/_build,./.venv,./uv.lock,./dist,./htmlcov,./.git,./results"
# MAPE is the standard acronym for mean absolute prediction error (Riley &
# Collins 2023), not a misspelling of "map".
ignore-words-list = "mape"

[tool.deptry]
extend_exclude = ["scripts"]

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs|scripts|experiments'

[tool.pyright]
include = ["stable_cart"]
typeCheckingMode = "standard"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["stable_cart"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
